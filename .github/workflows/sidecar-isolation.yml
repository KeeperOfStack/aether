name: Sidecar isolation

on:
  push:
    branches: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

jobs:
  isolation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the voice client does not include screen-share dependencies
        run: sh scripts/check_sidecar_isolation.sh
